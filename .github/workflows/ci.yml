name: Backend checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: stepway
          MYSQL_USER: stepway
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      RUN_DATABASE_TESTS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/stepway?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: stepway
      SPRING_DATASOURCE_PASSWORD: test-password
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEMO_ADMIN_EMAIL: admin@example.com
      DEMO_ADMIN_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - run: bash mvnw -B clean verify
