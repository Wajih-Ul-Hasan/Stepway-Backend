spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stepway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stepway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
server.port=${PORT:8080}
spring.jpa.hibernate.use-new-id-generator-mappings=false
# Demo schema management; use versioned migrations for production.
spring.jpa.hibernate.ddl-auto=update
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.jwt.secret=${JWT_SECRET}
app.bootstrap.admin-email=${DEMO_ADMIN_EMAIL:}
app.bootstrap.admin-password=${DEMO_ADMIN_PASSWORD:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5500}
app.email.from=${APP_EMAIL_FROM:${spring.mail.username:}}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
